<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HelioPath | espressodriven</title>
  <meta name="theme-color" content="#1a110f">
  <!-- Apply the persisted theme (auto/light/dark) before first paint, exactly like the main
       site, so the demo opens in the mode the visitor chose — no flash of the wrong theme.
       localStorage is per-origin, so the choice made on www.espressodriven.com carries over. -->
  <script>try{var t=localStorage.getItem('theme')||'dark';if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <!-- Satoshi, the site's text face, for the header; JetBrains Mono for the settings panel. -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Single source of truth: every colour token and the whole dark/light/auto theme system
       live in the site stylesheet. The demo is served from /demo/heliopath/, so this
       root-absolute path resolves to the very same cached file the main page uses. -->
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Demo-only component styles. No colours or fonts are (re)defined here — everything
       references the shared tokens from styles.css, so the two can never drift. These rules
       only (a) reset the few page-wide globals that don't fit a full-bleed canvas app and
       (b) lay out the Unity overlay UI, which exists only in the demo. */
    html,body{height:100%;overflow:hidden}
    #app{position:relative;height:100dvh}

    /* Header: the site's own nav from styles.css (same height, wordmark and glass bar), held in
       its scrolled state because the scene always runs underneath it. No title: the scene and
       the wordmark say where you are. Only the way back sits on the right, as an icon button
       with its label kept for screen readers and as a tooltip. */
    .nav{padding-top:env(safe-area-inset-top)}
    .demo-back{margin-left:auto}   /* the site's .icon-btn, like the theme toggle on the page */

    #stage{position:absolute;inset:0}   /* fills the whole app; the header overlays its top */
    #unity-canvas{width:100%;height:100%;display:block;background:var(--bg)}

    #loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:var(--gap-m);background:var(--bg)}
    #loader.hidden{display:none}
    .loading-label{font-size:var(--fs-s);color:var(--fg-muted)}
    .bar{width:min(280px,60vw);height:2px;border-radius:2px;overflow:hidden;
      background:color-mix(in srgb, var(--crema) 18%, transparent)}
    .bar>span{display:block;height:100%;width:0;background:var(--crema);transition:width var(--t-fast) var(--ease-out)}

    /* Quiet controls over the scene share one surface: the nav's glass, so the header, the
       fullscreen button and the panel read as one family. */
    /* Builds on the shared .icon-btn (tap size, round, icon centred) and adds the glass surface,
       so it matches the back arrow in the header. The icon swaps with the fullscreen state. */
    .fullscreen-btn{position:absolute;top:calc(env(safe-area-inset-top) + var(--nav-h) + var(--gap-m));z-index:5;
      right:calc(max(0px, (100% - var(--container)) / 2) + var(--gutter));  /* same column as the back arrow */
      color:var(--fg);background:var(--nav-glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      box-shadow:inset 0 0 0 1px var(--line);
      transition:box-shadow var(--t-fast) var(--ease-out),background-color var(--t-fast) var(--ease-out)}
    .fullscreen-btn:hover{background:var(--nav-glass);box-shadow:inset 0 0 0 1px var(--line-strong)}
    /* In fullscreen there is no header to line up with, so the button moves into the corner.
       Two rules because a selector list with an unknown pseudo-class would drop both. */
    #stage:fullscreen .fullscreen-btn{top:calc(env(safe-area-inset-top) + var(--gap-m));right:calc(env(safe-area-inset-right) + var(--gap-m))}
    #stage:-webkit-full-screen .fullscreen-btn{top:calc(env(safe-area-inset-top) + var(--gap-m));right:calc(env(safe-area-inset-right) + var(--gap-m))}
    .fullscreen-btn .icon-exit{display:none}
    .fullscreen-btn[data-active="true"] .icon-enter{display:none}
    .fullscreen-btn[data-active="true"] .icon-exit{display:block}

    #unity-warning{position:absolute;left:var(--gap-m);top:var(--gap-m);z-index:60;max-width:60ch;  /* above the header so a transient banner is never hidden */
      font-size:var(--fs-xs);line-height:1.4}

    /* ── HelioPath overlay (replaces the in-build UI Toolkit panel) ─────────────────
       Pure DOM over the canvas. Controls drive the sun through HelioPathWebBridge via
       unityInstance.SendMessage. Bottom-centred. The surface is the nav glass, which is nearly
       opaque, so labels stay legible over a bright sky; the blur only softens what shows through.
       Type is JetBrains Mono, as in the panel's first version: an instrument panel reads well in
       a monospace, and the figures line up by themselves. Compact on purpose, it sits on the scene. */
    #hp-ui{
      --panel-font: "JetBrains Mono", ui-monospace, monospace;
      --panel-fs-s: .75rem;      /* labels, values, buttons */
      --panel-fs-m: .8125rem;    /* inputs, switch labels, tabs */
      --panel-fs-l: 1rem;        /* panel title */
      --panel-gap: 12px;         /* between fields and sections */
      --panel-gap-tight: 6px;    /* label to its control */
      position:absolute;left:50%;bottom:var(--gap-m);transform:translateX(-50%);z-index:4;
      max-width:calc(100% - 2 * var(--gap-m));display:none;flex-direction:column;gap:var(--panel-gap);
      padding:var(--gap-m);color:var(--fg);font-family:var(--panel-font);
      background:var(--nav-glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      border:1px solid var(--line);border-radius:var(--r-l)}
    #hp-ui.ready{display:flex}
    #hp-ui.minimized .hp-tabs,#hp-ui.minimized .hp-body{display:none}

    .hp-head{display:flex;align-items:center;justify-content:space-between;gap:var(--panel-gap);cursor:pointer}
    .hp-head h2{margin:0;font:500 var(--panel-fs-l)/1.2 var(--panel-font);color:var(--fg)}
    .hp-min{appearance:none;width:24px;height:24px;display:grid;place-items:center;
      border-radius:calc(var(--r-s) - 2px);cursor:pointer;color:var(--fg-muted);background:transparent;border:1px solid var(--line);
      transition:color var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
    .hp-head:hover .hp-min{color:var(--fg);border-color:var(--line-strong)}
    /* Single chevron, rotated by state: points up while minimized (expand upward), flips to point
       down when open. The .minimized class on #hp-ui is the only state source — JS never touches
       the glyph. */
    .hp-min svg{display:block;transition:transform var(--t-fast) var(--ease-out)}
    #hp-ui:not(.minimized) .hp-min svg{transform:rotate(180deg)}

    /* Tabs: shown only in compact mode (see media query). The highlight is one shared surface
       that slides from the last tab to the new one. JS sets --tab-index and --tab-count, so the
       slide is a transform only and works for any number of equal-width tabs. */
    .hp-tabs{--tab-pad:4px;--tab-gap:4px;position:relative;display:none;gap:var(--tab-gap);padding:var(--tab-pad);
      border-radius:var(--r-s);background:color-mix(in srgb, var(--fg) 6%, transparent)}
    .hp-tabs::before{content:"";position:absolute;top:var(--tab-pad);bottom:var(--tab-pad);left:var(--tab-pad);
      width:calc((100% - 2 * var(--tab-pad) - (var(--tab-count, 3) - 1) * var(--tab-gap)) / var(--tab-count, 3));
      transform:translateX(calc(var(--tab-index, 0) * (100% + var(--tab-gap))));
      border-radius:calc(var(--r-s) - var(--tab-pad));background:var(--bg-raised);box-shadow:0 0 0 1px var(--line);
      transition:transform var(--t-med) var(--ease-out)}
    .hp-tab{position:relative;flex:1;appearance:none;cursor:pointer;font:500 var(--panel-fs-m)/1 var(--panel-font);
      padding:8px 6px;border:0;background:transparent;color:var(--fg-muted);transition:color var(--t-med) var(--ease-out)}
    .hp-tab.active{color:var(--fg)}
    @media (prefers-reduced-motion: reduce){ .hp-tabs::before{transition:none} }

    /* Body: three side-by-side sections on wide screens, one tabbed column when compact. */
    .hp-body{display:flex;flex-direction:row;gap:var(--gap-l)}
    .hp-section{display:flex;flex-direction:column;gap:var(--panel-gap);width:264px;max-width:100%}
    .hp-section + .hp-section{padding-left:var(--gap-l);border-left:1px solid var(--line)}
    .hp-section-title{font:500 var(--panel-fs-s)/1.2 var(--panel-font);color:var(--crema);margin:0}

    .hp-field{display:flex;flex-direction:column;gap:var(--panel-gap-tight)}
    .hp-field label{font-size:var(--panel-fs-s);color:var(--fg-muted)}
    .hp-row{display:flex;gap:var(--panel-gap-tight);align-items:center;flex-wrap:wrap}

    #hp-ui select,#hp-ui input[type="date"],#hp-ui input[type="time"]{color:var(--fg);
      font:400 var(--panel-fs-m)/1.2 var(--panel-font);padding:7px 9px;
      border-radius:calc(var(--r-s) - 2px);border:1px solid var(--line);background:color-mix(in srgb, var(--fg) 6%, transparent)}
    #hp-ui select{width:100%}
    /* Real min-width (not 0) + flex:auto so Safari/macOS keeps its native date/time fields wide
       enough to click and edit; .hp-row wraps (flex-wrap) when the panel is too narrow for both. */
    #hp-ui input[type="date"],#hp-ui input[type="time"]{flex:1 1 auto;min-width:8em}
    #hp-ui select:focus-visible,#hp-ui input:focus-visible{outline:2px solid var(--crema);outline-offset:1px}
    #hp-ui select option{background:var(--bg);color:var(--fg)}

    .hp-btn{flex:1;appearance:none;cursor:pointer;font:500 var(--panel-fs-s)/1 var(--panel-font);
      padding:8px 10px;border-radius:calc(var(--r-s) - 2px);color:var(--fg);background:transparent;border:1px solid var(--line-strong);
      transition:border-color var(--t-fast) var(--ease-out)}
    .hp-btn:hover{border-color:var(--fg)}
    .hp-btn--inline{flex:0 0 auto}

    .hp-switch{display:flex;align-items:center;justify-content:space-between;gap:var(--panel-gap);cursor:pointer}
    .hp-switch span{font-size:var(--panel-fs-m);color:var(--fg)}
    .hp-toggle{position:relative;width:40px;height:22px;border-radius:11px;flex:0 0 auto;
      background:color-mix(in srgb, var(--fg) 18%, transparent);transition:background-color var(--t-fast) var(--ease-out)}
    .hp-toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
      border-radius:50%;background:var(--fg);transition:transform var(--t-fast) var(--ease-out)}
    .hp-switch.on .hp-toggle{background:var(--crema)}
    .hp-switch.on .hp-toggle::after{transform:translateX(18px);background:var(--on-crema)}

    #hp-ui input[type="range"]{width:100%;margin:0;accent-color:var(--crema)}
    .hp-range-head{display:flex;align-items:baseline;justify-content:space-between}
    .hp-range-head .val{font-size:var(--panel-fs-s);color:var(--fg)}
    .hp-sub{display:flex;flex-direction:column;gap:var(--panel-gap-tight);transition:opacity var(--t-fast) var(--ease-out)}
    .hp-sub.dim{opacity:.4;pointer-events:none}
    .hp-coords{font-size:var(--panel-fs-s);color:var(--fg-muted)}

    /* Compact: tabs replace the side-by-side layout so the panel never overloads phones. */
    @media (max-width:720px){
      /* Only the expanded panel needs the full width for its single-column tab layout. Minimized,
         it keeps the content-driven width it has on wide screens, so the collapsed head looks the
         same at every viewport size instead of stretching edge to edge. */
      #hp-ui:not(.minimized){width:100%}
      .hp-tabs{display:flex}
      .hp-body{flex-direction:column}
      .hp-section{display:none;width:auto}
      .hp-section.active{display:flex}
      .hp-section + .hp-section{padding-left:0;border-left:0}
      .hp-section-title{display:none}
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="nav" data-scrolled="true">
      <div class="container">
        <a class="nav-logo" href="/" aria-label="espressodriven, home"><span class="wordmark" aria-hidden="true"></span></a>
        <a class="icon-btn demo-back" href="/#assets" aria-label="Back to assets" title="Back to assets">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </a>
      </div>
    </header>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <!-- HelioPath HTML overlay. Populated/shown once the location database arrives. -->
      <div id="hp-ui" class="minimized" aria-label="HelioPath controls">
        <div class="hp-head">
          <h2>Settings</h2>
          <button class="hp-min" id="hp-min" title="Expand" aria-label="Expand settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"></polyline></svg>
          </button>
        </div>

        <div class="hp-tabs" role="tablist">
          <button class="hp-tab active" data-tab="position">Position</button>
          <button class="hp-tab" data-tab="datetime">Date &amp; Time</button>
          <button class="hp-tab" data-tab="effects">Effects</button>
        </div>

        <div class="hp-body">
          <!-- ── Position (positioner: location, azimuth) ───────────────────────── -->
          <section class="hp-section active" data-section="position">
            <h3 class="hp-section-title">Position</h3>

            <div class="hp-field">
              <label for="hp-country">Location</label>
              <select id="hp-country"></select>
              <select id="hp-place"></select>
              <span class="hp-coords" id="hp-coords"></span>
            </div>

            <div class="hp-field">
              <div class="hp-range-head">
                <label for="hp-azimuth" class="hp-sublabel">Azimuth offset</label>
                <span class="val" id="hp-azimuth-val">0°</span>
              </div>
              <input type="range" id="hp-azimuth" min="-180" max="180" step="1" value="0">
            </div>
          </section>

          <!-- ── Date & Time (positioner: system vs. manual time, time-lapse) ───── -->
          <section class="hp-section" data-section="datetime">
            <h3 class="hp-section-title">Date &amp; Time</h3>

            <div class="hp-field">
              <div class="hp-switch" id="hp-systemtime">
                <span>Use System Time</span>
                <span class="hp-toggle"></span>
              </div>
            </div>

            <div class="hp-field hp-sub dim" id="hp-manual-sub">
              <label>Date &amp; time</label>
              <div class="hp-row">
                <input type="date" id="hp-date">
                <input type="time" id="hp-time">
                <button class="hp-btn hp-btn--inline" id="hp-now">Now</button>
              </div>
            </div>

            <div class="hp-field hp-sub dim" id="hp-timelapse-sub">
              <div class="hp-switch" id="hp-timelapse">
                <span>Time-lapse</span>
                <span class="hp-toggle"></span>
              </div>
              <div class="hp-sub dim" id="hp-daylength-sub">
                <div class="hp-range-head">
                  <label for="hp-daylength">Day duration</label>
                  <span class="val" id="hp-daylength-val">1 min</span>
                </div>
                <input type="range" id="hp-daylength" min="0" max="1" step="0.001" value="0">
              </div>
            </div>
          </section>

          <!-- ── Effects (radiance: colour temperature, spikes, halo) ──────────── -->
          <section class="hp-section" data-section="effects">
            <h3 class="hp-section-title">Effects</h3>

            <div class="hp-field">
              <div class="hp-switch on" id="hp-coloralt">
                <span>Color from altitude</span>
                <span class="hp-toggle"></span>
              </div>
            </div>

            <div class="hp-field">
              <div class="hp-switch on" id="hp-spikes">
                <span>Spikes</span>
                <span class="hp-toggle"></span>
              </div>
              <div class="hp-sub" id="hp-spike-sub">
                <div class="hp-range-head">
                  <label for="hp-spikesize">Spike size</label>
                  <span class="val" id="hp-spikesize-val">1.0×</span>
                </div>
                <input type="range" id="hp-spikesize" min="0" max="5" step="0.05" value="1">
              </div>
            </div>

            <div class="hp-field">
              <div class="hp-switch on" id="hp-halo">
                <span>Halo</span>
                <span class="hp-toggle"></span>
              </div>
              <div class="hp-sub" id="hp-halo-sub">
                <div class="hp-range-head">
                  <label for="hp-haloradius">Radius</label>
                  <span class="val" id="hp-haloradius-val">21.8°</span>
                </div>
                <input type="range" id="hp-haloradius" min="5" max="46" step="0.5" value="21.8">
              </div>
            </div>
          </section>
        </div>
      </div>

      <div id="loader">
        <div class="loading-label">Loading HelioPath &hellip;</div>
        <div class="bar"><span id="bar-fill"></span></div>
      </div>
      <button class="icon-btn fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg class="icon icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="icon icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
      <div id="unity-warning"></div>
    </div>
  </div>

  <script>
    // Keep the iOS status/address-bar tint in step with the active theme: read the page
    // background token and, while on 'auto', re-read it when the OS
    // flips light/dark (the page colours themselves already follow via the CSS media query).
    (function syncThemeColor() {
      var meta = document.querySelector('meta[name="theme-color"]');
      function apply() {
        var c = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
        if (c && meta) meta.setAttribute("content", c);
      }
      apply();
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (!document.documentElement.hasAttribute("data-theme")) apply(); // only matters in 'auto'
      });
    })();

    var canvas        = document.querySelector("#unity-canvas");
    var loader        = document.querySelector("#loader");
    var barFill       = document.querySelector("#bar-fill");
    var warningBanner = document.querySelector("#unity-warning");

    // Unity calls this for compatibility/quota/error notices.
    function unityShowBanner(msg, type) {
      warningBanner.innerHTML = msg;
      warningBanner.style.padding = "8px 12px";
      warningBanner.style.borderRadius = "6px";
      warningBanner.style.border = "1px solid";
      if (type === "error") {
        warningBanner.style.color = "#f5a3a3";
        warningBanner.style.borderColor = "#7a3030";
        warningBanner.style.background = "rgba(40,10,10,.72)";
      } else {
        warningBanner.style.color = "#f0d090";
        warningBanner.style.borderColor = "#5a4520";
        warningBanner.style.background = "rgba(40,30,10,.72)";
        // Unity auto-clears warnings after a while.
        setTimeout(function () { warningBanner.innerHTML = ""; warningBanner.removeAttribute("style"); }, 6000);
      }
    }

    function el(id) { return document.getElementById(id); }

    // ── HelioPath bridge glue ────────────────────────────────────────────────────────
    // The bridge GameObject's name; must match HelioPathWebBridge's host object in the scene.
    var HP_TARGET = "HelioPathWebBridge";
    var DAY_MIN = 60, DAY_MAX = 86400; // seconds; mirrors HelioPathPositioner.DayDurationSeconds clamp
    var DEFAULT_COUNTRY = "Germany", DEFAULT_PLACE = "Stralsund";
    // Curated start moment: summer solstice (longest, highest sun path) at ~sunrise. The panel
    // opens in manual time (Use System Time off), so these fixed values drive the scene on load.
    var DEFAULT_DATE = "2026-06-21", DEFAULT_TIME = "04:50";

    var hpUnity = null;            // resolved Unity instance
    var hpDb = null;               // parsed location database
    var hpManual = false;          // true once the user picks a fixed time (vs. system time)
    var hpNowDrive = false;        // set while the Now button awaits the place's wall clock from Unity

    function hpSend(method, value) {
      if (!hpUnity) return;
      hpUnity.SendMessage(HP_TARGET, method, value === undefined ? "" : String(value));
    }

    // Unity -> JS one-shot: the curated location database, pushed by HelioPathBridge.jslib.
    window.onHelioPathReady = function (json) {
      try { hpDb = JSON.parse(json); } catch (e) { console.error("[HelioPath] bad location JSON", e); return; }
      buildLocationUI(hpDb.Countries || []);
      // Sync the sun to the panel's initial time mode so UI and render agree at start. Default
      // is manual time (Use System Time off), so push the fixed date/time; in system mode use
      // the real clock. Also push the day-duration default so a later time-lapse toggle matches.
      if (el("hp-systemtime").classList.contains("on")) hpSend("UseRealTime");
      else hpSend("SetLocalTime", manualIso());
      hpSend("SetDayDuration", Math.round(secondsFromSlider(parseFloat(el("hp-daylength").value))));
      document.querySelector("#hp-ui").classList.add("ready");
    };

    // Unity -> JS: the selected place's current local wall clock (daylight-saving-adjusted in C#), as a
    // zone-less "YYYY-MM-DDTHH:mm". Answers a RequestPlaceNow call: fill the date/time inputs, and when the
    // Now button asked for it, also drive the sun from that time (round-trips back through C# DST, so the
    // shown time and the rendered sun agree). The DST rule table lives only in C#; the page never replicates it.
    window.onHelioPathPlaceNow = function (iso) {
      el("hp-date").value = iso.slice(0, 10);
      el("hp-time").value = iso.slice(11, 16);
      if (hpNowDrive) { hpNowDrive = false; sendManualTime(); }
    };

    // ── Location ───────────────────────────────────────────────────────────────────
    function buildLocationUI(countries) {
      var country = el("hp-country"), place = el("hp-place");
      // Sort countries by name; keep each country's place order from the asset.
      countries = countries.slice().sort(function (a, b) { return a.Name.localeCompare(b.Name); });

      country.innerHTML = "";
      countries.forEach(function (c, i) {
        var o = document.createElement("option");
        o.value = String(i); o.textContent = c.Name; country.appendChild(o);
      });

      function buildPlaceOptions() {
        var c = countries[country.value | 0];
        place.innerHTML = "";
        (c.Places || []).forEach(function (p, i) {
          var o = document.createElement("option");
          o.value = String(i); o.textContent = p.Name; place.appendChild(o);
        });
      }

      function applyPlace() {
        var c = countries[country.value | 0];
        var p = (c.Places || [])[place.value | 0];
        if (!p) return;
        var lat = p.Coordinates.Latitude, lon = p.Coordinates.Longitude, off = p.UtcOffsetHours;
        // Pass the place's standard offset AND its DST rule (enum int) so C# applies summer time to every
        // local-time conversion; the sun position itself is always computed in UTC and unaffected.
        hpSend("SetLocation", lat.toFixed(4) + "," + lon.toFixed(4) + "," + off + "," + (p.Dst | 0));
        el("hp-coords").textContent =
          lat.toFixed(2) + "°, " + lon.toFixed(2) + "°  ·  UTC" + (off >= 0 ? "+" : "") + off;
        // In manual mode re-send the time so the new place's offset/DST is honoured; otherwise preview the
        // new place's current wall clock (asked back from Unity, so it is DST-correct) for when the user switches.
        if (hpManual) hpSend("SetLocalTime", manualIso());
        else          hpSend("RequestPlaceNow");
      }

      country.onchange = function () { buildPlaceOptions(); place.value = "0"; applyPlace(); };
      place.onchange = applyPlace;

      // Default selection: Stralsund, Germany (falls back to the first entry if absent).
      var ci = countries.findIndex(function (c) { return c.Name === DEFAULT_COUNTRY; });
      if (ci >= 0) country.value = String(ci);
      buildPlaceOptions();
      var places = countries[country.value | 0].Places || [];
      var pi = places.findIndex(function (p) { return p.Name === DEFAULT_PLACE; });
      if (pi >= 0) place.value = String(pi);
      applyPlace();
    }

    // ── Time ─────────────────────────────────────────────────────────────────────
    // The split inputs combined into the "YYYY-MM-DDTHH:mm" the bridge's SetLocalTime expects.
    function manualIso() { return el("hp-date").value + "T" + el("hp-time").value; }
    function sendManualTime() {
      if (!el("hp-date").value || !el("hp-time").value) return;
      setSystemTime(false);
      hpSend("SetLocalTime", manualIso());
    }

    // "Use System Time" on dims + disables the manual date/time and the whole time-lapse section
    // (time-lapse only applies to manual time), mirroring the inspector. Only one dim level applies
    // at a time so opacity never composites twice.
    function refreshDimming() {
      var system = el("hp-systemtime").classList.contains("on");
      var tl = el("hp-timelapse").classList.contains("on");
      el("hp-manual-sub").classList.toggle("dim", system);
      el("hp-timelapse-sub").classList.toggle("dim", system);
      el("hp-daylength-sub").classList.toggle("dim", !system && !tl);
      hpManual = !system;
    }
    function setSystemTime(on) {
      el("hp-systemtime").classList.toggle("on", on);
      refreshDimming();
    }

    function wireTimeControls() {
      // Start on the curated showcase moment (solstice, ~sunrise); the panel opens in manual
      // time, so these fixed values drive the sun until the user edits them or picks "Now".
      el("hp-date").value = DEFAULT_DATE;
      el("hp-time").value = DEFAULT_TIME;

      el("hp-systemtime").onclick = function () {
        var on = !this.classList.contains("on");
        setSystemTime(on);
        if (on) hpSend("UseRealTime");
        else    hpSend("SetLocalTime", manualIso());
      };
      el("hp-now").onclick = function () {
        // Ask Unity for the place's current wall clock (DST-correct); the callback fills the inputs and,
        // because hpNowDrive is set, drives the sun from it. Keeps all daylight-saving math in C#.
        hpNowDrive = true;
        hpSend("RequestPlaceNow");
      };
      el("hp-date").onchange = sendManualTime;
      el("hp-time").onchange = sendManualTime;

      el("hp-azimuth").oninput = function () {
        var v = parseInt(this.value, 10);
        el("hp-azimuth-val").textContent = (v > 0 ? "+" : "") + v + "°";
        hpSend("SetAzimuthOffset", v);
      };
    }

    // Time-lapse + day-duration (log slider mirrors HelioPathPositioner's inspector mapping).
    function secondsFromSlider(t) {
      var lo = Math.log(DAY_MIN), hi = Math.log(DAY_MAX);
      return Math.exp(lo + (hi - lo) * Math.min(1, Math.max(0, t)));
    }
    function formatDayDuration(s) {
      // Round first: at the slider's max, exp(log(86400)) can land a hair below 86400 (float
      // error) and otherwise render as "23h 60m" instead of "real-time".
      s = Math.round(s);
      if (s >= DAY_MAX) return "real-time";
      if (s < 3600) return Math.round(s / 60) + " min";
      var h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
      if (m === 60) { h += 1; m = 0; }
      return m > 0 ? h + "h " + m + "m" : h + "h";
    }
    function wireTimeLapse() {
      var sw = el("hp-timelapse"), slider = el("hp-daylength");
      sw.onclick = function () {
        var on = !sw.classList.contains("on");
        sw.classList.toggle("on", on);
        refreshDimming();
        hpSend("SetTimeLapse", on ? "1" : "0");
      };
      slider.oninput = function () {
        var s = secondsFromSlider(parseFloat(this.value));
        el("hp-daylength-val").textContent = formatDayDuration(s);
        hpSend("SetDayDuration", Math.round(s));
      };
    }

    // ── Effects (radiance) ─────────────────────────────────────────────────────────
    // Reusable on/off switch: toggles the .on class, optionally dims a sub-group, sends the flag.
    function wireSwitch(switchId, method, subId) {
      var sw = el(switchId);
      sw.onclick = function () {
        var on = !sw.classList.contains("on");
        sw.classList.toggle("on", on);
        if (subId) el(subId).classList.toggle("dim", !on);
        hpSend(method, on ? "1" : "0");
      };
    }
    function wireEffects() {
      wireSwitch("hp-coloralt", "SetColorFromAltitude");
      wireSwitch("hp-spikes", "SetSpikesEnabled", "hp-spike-sub");
      wireSwitch("hp-halo", "SetHaloEnabled", "hp-halo-sub");

      el("hp-spikesize").oninput = function () {
        var v = parseFloat(this.value);
        el("hp-spikesize-val").textContent = v.toFixed(1) + "×";
        hpSend("SetSpikeSize", v);
      };
      el("hp-haloradius").oninput = function () {
        var v = parseFloat(this.value);
        el("hp-haloradius-val").textContent = v.toFixed(1) + "°";
        hpSend("SetHaloRadius", v);
      };
    }

    // ── Tabs (compact mode) ──────────────────────────────────────────────────────
    function wireTabs() {
      var bar = document.querySelector(".hp-tabs");
      var tabs = document.querySelectorAll(".hp-tab");
      // The sliding highlight (.hp-tabs::before) is positioned from these two values in CSS.
      bar.style.setProperty("--tab-count", tabs.length);
      tabs.forEach(function (t, i) {
        t.onclick = function () {
          var name = t.dataset.tab;
          bar.style.setProperty("--tab-index", i);
          tabs.forEach(function (x) { x.classList.toggle("active", x === t); });
          document.querySelectorAll(".hp-section").forEach(function (s) {
            s.classList.toggle("active", s.dataset.section === name);
          });
        };
      });
    }

    // The whole head row is the toggle target: clicking the title — or the button, whose click
    // bubbles up to here — minimizes/expands the panel. The button stays for its visible +/− affordance.
    document.querySelector(".hp-head").onclick = function () {
      var btn = el("hp-min");
      var min = document.querySelector("#hp-ui").classList.toggle("minimized");
      // The chevron's direction is pure CSS (rotated off .minimized); JS only keeps the labels in sync.
      btn.title = min ? "Expand" : "Minimize";
      btn.setAttribute("aria-label", min ? "Expand settings" : "Minimize settings");
      btn.setAttribute("aria-expanded", min ? "false" : "true");
    };

    // ── Fullscreen ─────────────────────────────────────────────────────────────────
    // Only offered where a real Element fullscreen is possible. iOS / iPadOS cannot fullscreen
    // arbitrary elements (only <video>), so the button is hidden there entirely.
    function fullscreenSupported() {
      var stage = document.querySelector("#stage");
      var hasApi = !!(stage.requestFullscreen || stage.webkitRequestFullscreen) &&
                   !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS poses as Mac
      return hasApi && !iOS;
    }
    function updateFsLabel() {
      var active = document.fullscreenElement || document.webkitFullscreenElement;
      var btn = document.querySelector("#fullscreen-btn");
      btn.dataset.active = active ? "true" : "false";
      btn.title = active ? "Exit fullscreen" : "Fullscreen";
      btn.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
    }
    function wireFullscreen() {
      var btn = document.querySelector("#fullscreen-btn");
      if (!fullscreenSupported()) { btn.style.display = "none"; return; }
      var stage = document.querySelector("#stage");
      var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      var exitFs = document.exitFullscreen || document.webkitExitFullscreen;
      btn.onclick = function () {
        var active = document.fullscreenElement || document.webkitFullscreenElement;
        if (active) { if (exitFs) exitFs.call(document); }
        else        { req.call(stage); }
      };
      document.addEventListener("fullscreenchange", updateFsLabel);
      document.addEventListener("webkitfullscreenchange", updateFsLabel);
    }

    wireTabs();
    wireTimeControls();
    wireTimeLapse();
    wireEffects();
    wireFullscreen();
    refreshDimming(); // initial state: "Use System Time" on → manual + time-lapse dimmed

    // ── Unity loader ───────────────────────────────────────────────────────────────
    var buildUrl = "Build";
    var config = {
      dataUrl:      buildUrl + "/heliopath.data.unityweb",
      frameworkUrl: buildUrl + "/heliopath.framework.js.unityweb",
      codeUrl:      buildUrl + "/heliopath.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "espressodriven",
      productName:    "HelioPath",
      productVersion: "1.1.0",
      showBanner:     unityShowBanner,
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/heliopath.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        hpUnity = unityInstance;
        loader.classList.add("hidden");
        // If the bridge fired its one-shot export before this handler existed, drain it now.
        if (window.__helioPathPendingDb) {
          window.onHelioPathReady(window.__helioPathPendingDb);
          window.__helioPathPendingDb = null;
        }
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
