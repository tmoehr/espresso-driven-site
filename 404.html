<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d0a">
  <meta name="robots" content="noindex">
  <title>Page not found | espressodriven</title>
  <link rel="icon" href="/images/logo/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500&display=swap" rel="stylesheet">
  <!-- GitHub Pages serves this file for every unknown address, at any depth, so every path
       here is root-absolute. Tokens, fonts and the nav come from the site stylesheet. -->
  <link rel="stylesheet" href="/styles.css">
  <script src="/scripts/theme.js"></script>
  <style>
    /* Page-only styles. No colours or fonts are defined here: everything references the shared
       tokens from styles.css. */
    .lost{
      /* The needle's story: steady at brewing pressure, then a tremor that grows, then the
         machine gives up and the pressure is gone at once. */
      --bar-step: 22.5deg;      /* one bar on the dial: 270 degrees over 12 bar */
      --t-drop: 3200ms;
      --impact: .53;            /* the share of --t-drop at which the needle hits its stop */
      --ease-collapse: cubic-bezier(.9,0,1,1);   /* nothing, then everything */
      --jolt: 3px;              /* how far the dial is knocked by the impact */
      min-height: 100svh;
      display: grid; align-content: center; justify-items: center; gap: var(--gap-m);
      padding-block: calc(var(--nav-h) + var(--gap-xl)) var(--gap-xl);
      text-align: center;
    }
    .gauge{ width: min(70%, 17rem); height: auto; overflow: visible; margin-bottom: var(--gap-s); }
    .gauge-rim{ fill: none; stroke: var(--line-strong); stroke-width: 2; }
    .gauge-zone{ fill: none; stroke: var(--crema); stroke-width: 7; }
    .gauge-tick{ stroke: var(--fg-muted); stroke-width: 1.5; }
    .gauge-tick-major{ stroke: var(--fg); stroke-width: 2.5; }
    /* The pivot (transform-origin) is set by gauge.js, which knows where the hub is. */
    .gauge-needle{ stroke: var(--fg); stroke-width: 3; stroke-linecap: round; transform-box: view-box; }
    .gauge-hub{ fill: var(--fg); }
    .gauge text{ fill: var(--fg-muted); font: 500 11px "JetBrains Mono", ui-monospace, monospace; text-anchor: middle; dominant-baseline: central; }
    .lost h1{ font: var(--fw-display-strong) var(--fs-2xl)/var(--lh-flat) var(--font-display); letter-spacing: var(--tracking-tight); }
    .lost p{ max-width: 30rem; font-size: var(--fs-l); line-height: var(--lh-lead); color: var(--fg-muted); }
    .lost .btn{ margin-top: var(--gap-s); }

    @media (prefers-reduced-motion: no-preference){
      .gauge-needle{ animation: pressure-drop var(--t-drop) ease-in-out both; }
      .gauge{ animation: jolt var(--t-drop) ease-out both; }
      /* The reading and the way back arrive as the needle lands. */
      .lost h1, .lost p, .lost .btn{ animation: lift var(--t-slow) var(--ease-out) calc(var(--t-drop) * var(--impact)) both; }
      /* The factors are bar readings on the dial. 53% is --impact (keyframe selectors cannot use variables). */
      @keyframes pressure-drop{
        0%, 14%{ transform: rotate(calc(var(--bar-step) * 9)); }
        17%{ transform: rotate(calc(var(--bar-step) * 9.15)); }
        20%{ transform: rotate(calc(var(--bar-step) * 8.9)); }
        23%{ transform: rotate(calc(var(--bar-step) * 9.2)); }
        26%{ transform: rotate(calc(var(--bar-step) * 8.8)); }
        29%{ transform: rotate(calc(var(--bar-step) * 9.3)); }
        32%{ transform: rotate(calc(var(--bar-step) * 8.7)); }
        35%{ transform: rotate(calc(var(--bar-step) * 9.5)); }
        38%{ transform: rotate(calc(var(--bar-step) * 8.5)); }
        41%{ transform: rotate(calc(var(--bar-step) * 9.8)); }
        43%{ transform: rotate(calc(var(--bar-step) * 8.3)); }
        45%{ transform: rotate(calc(var(--bar-step) * 10.2)); }
        47%{ transform: rotate(calc(var(--bar-step) * 8.0)); }
        49%{ transform: rotate(calc(var(--bar-step) * 10.6)); animation-timing-function: var(--ease-collapse); }
        53%{ transform: rotate(0deg); animation-timing-function: ease-out; }
        59%{ transform: rotate(calc(var(--bar-step) * 1.6)); animation-timing-function: ease-in; }
        65%{ transform: rotate(0deg); animation-timing-function: ease-out; }
        70%{ transform: rotate(calc(var(--bar-step) * .5)); animation-timing-function: ease-in; }
        75%{ transform: rotate(0deg); animation-timing-function: ease-out; }
        79%{ transform: rotate(calc(var(--bar-step) * .15)); animation-timing-function: ease-in; }
        83%, 100%{ transform: rotate(0deg); }
      }
      /* The whole dial takes the knock when the needle hits the stop. */
      @keyframes jolt{
        0%, 53%{ transform: none; }
        55%{ transform: translateY(var(--jolt)) rotate(-1deg); }
        62%, 100%{ transform: none; }
      }
    }
  </style>
</head>
<body>
  <header class="nav" data-scrolled="true">
    <div class="container">
      <a class="nav-logo" href="/" aria-label="espressodriven, home"><span class="wordmark" aria-hidden="true"></span></a>
    </div>
  </header>

  <main class="container lost">
    <svg class="gauge" data-gauge viewBox="0 0 200 175" role="img" aria-label="A pressure gauge reading 0 bar. The 9 bar mark, where espresso is pulled, is highlighted."></svg>
    <h1>0 bar.</h1>
    <p>No pressure, no page. Nothing lives at this address.</p>
    <a class="btn btn-primary" href="/">Pull another shot</a>
  </main>

  <script src="/scripts/gauge.js"></script>
</body>
</html>
